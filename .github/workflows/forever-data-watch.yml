name: Forever direct data watch
on:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [main]
    paths:
      - 'tools/data-watch/**'
      - '.github/workflows/forever-data-watch.yml'
  pull_request:
    paths:
      - 'tools/data-watch/**'
      - '.github/workflows/forever-data-watch.yml'
  repository_dispatch:
    types: [forever-bluepost]
  workflow_dispatch:
    inputs:
      extract_client:
        description: 'Also export raw Blizzard client tables (first run requires CDN access)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: forever-data-watch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Data comparison regressions
        run: python -m unittest discover -s tools/data-watch -v
      - name: Restore last valid baseline
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/forever-data"
          git fetch --no-tags origin artifacts
          if git cat-file -e FETCH_HEAD:data-watch/latest/state.json.gz 2>/dev/null; then
            git show FETCH_HEAD:data-watch/latest/state.json.gz > "$RUNNER_TEMP/forever-data/previous.json.gz"
          fi
          if git cat-file -e FETCH_HEAD:data-watch/latest/blueposts.json 2>/dev/null; then
            git show FETCH_HEAD:data-watch/latest/blueposts.json > "$RUNNER_TEMP/forever-data/blueposts-previous.json"
          fi
      - name: Read Blizzard version service directly
        run: >-
          python tools/data-watch/watch.py
          --previous "$RUNNER_TEMP/forever-data/previous.json.gz"
          --output "$RUNNER_TEMP/forever-data/result"
          --raidbots
      - name: Check Forever blue posts
        run: >-
          python tools/data-watch/blueposts.py
          --previous "$RUNNER_TEMP/forever-data/blueposts-previous.json"
          --output "$RUNNER_TEMP/forever-data/result/blueposts.json"
          --report "$RUNNER_TEMP/forever-data/result/report.json"
      - name: Decide whether client extraction is needed
        id: extraction
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          report = json.loads(Path(os.environ['RUNNER_TEMP'] + '/forever-data/result/report.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('needed=' + str(report['extractionRequired'] or report.get('blueposts', {}).get('relevantChanges', 0) > 0).lower() + '\n')
          PYTHON
      - name: Extract matching Blizzard client tables and hotfixes
        id: client
        if: github.event_name != 'pull_request' && (steps.extraction.outputs.needed == 'true' || inputs.extract_client == true || github.event_name == 'repository_dispatch')
        continue-on-error: true
        run: >-
          python tools/data-watch/run_export.py
          --work "$RUNNER_TEMP/forever-exporter"
          --previous "$RUNNER_TEMP/forever-data/result/state.json.gz"
          --output "$RUNNER_TEMP/forever-data/candidate"
      - name: Promote complete extraction
        if: steps.client.outcome == 'success'
        run: |
          cp "$RUNNER_TEMP/forever-data/candidate/"{state.json.gz,report.json} "$RUNNER_TEMP/forever-data/result/"
          cp -R "$RUNNER_TEMP/forever-data/candidate/caches/." "$RUNNER_TEMP/forever-data/result/caches/"
      - name: Record effective data freshness
        env:
          CLIENT_OUTCOME: ${{ steps.client.outcome }}
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'forever-data/result/report.json'
          report = json.loads(path.read_text())
          blue = json.loads((path.parent / 'blueposts.json').read_text())
          report['blueposts'] = blue['lastCheck']
          outcome = os.environ['CLIENT_OUTCOME']
          report['clientExtraction'] = {'status': {'success': 'complete', 'failure': 'failed'}.get(outcome, 'not_needed'), 'previousDataRetained': outcome == 'failure'}
          path.write_text(json.dumps(report, indent=2) + '\n')
          PYTHON
      - name: Save validated baseline and report
        if: github.event_name != 'pull_request'
        run: |
          statehash="$(sha256sum "$RUNNER_TEMP/forever-data/result/state.json.gz" | cut -d ' ' -f 1)"
          mappings=(
            "$RUNNER_TEMP/forever-data/result/state.json.gz::data-watch/snapshots/$statehash.json.gz"
            "$RUNNER_TEMP/forever-data/result/report.json::data-watch/reports/$GITHUB_RUN_ID.json"
            "$RUNNER_TEMP/forever-data/result/state.json.gz::data-watch/latest/state.json.gz"
            "$RUNNER_TEMP/forever-data/result/report.json::data-watch/latest/report.json"
            "$RUNNER_TEMP/forever-data/result/blueposts.json::data-watch/latest/blueposts.json"
          )
          while IFS= read -r -d '' cache; do
            product="$(basename "$(dirname "$cache")")"
            digest="$(sha256sum "$cache" | cut -d ' ' -f 1)"
            mappings+=("$cache::data-watch/caches/$product/$digest.bin")
          done < <(find "$RUNNER_TEMP/forever-data/result/caches" -name DBCache.bin -print0)
          if test -f "$RUNNER_TEMP/forever-exporter/exporter.log"; then
            mappings+=("$RUNNER_TEMP/forever-exporter/exporter.log::data-watch/latest/exporter.log")
          fi
          bash .github/scripts/publish-artifacts.sh "${mappings[@]}"
      - name: Report extraction failure explicitly
        if: steps.client.outcome == 'failure'
        run: |
          echo '::warning::Client extraction failed. Previous effective database retained; cache download succeeded. Next daily check retries.'
          echo 'Client extraction FAILED: effective database remains at its previous build. See extraction log. Next daily run retries.' >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage summary
        if: success()
        run: |
          python - "$RUNNER_TEMP/forever-data/result/report.json" <<'PY'
          import json, os, sys
          report = json.load(open(sys.argv[1]))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Direct Blizzard data check\n\n')
              for product, data in report['products'].items():
                  out.write(f"- {product}: {data['row']['VersionsName']}\n")
              out.write(f"\nExtracted tables: {len(report['tables'])}. Hotfix coverage: {report['hotfixCoverage']}.\n")
              out.write('No production simulation values were changed automatically.\n')
          PY
