# Checks Engine daily at about 8:00 Berlin time (06:55 UTC; GitHub schedules run in UTC, so 8:55 in summer time).
#
# Scheduled runs start from the default branch (main); the engine lock is updated there as well.
# It works on ENGINE_BRANCH (main) and commits the new lock there.
# A failed run keeps the last good engine; the report and an issue say what stopped it.
name: ForeverCore engine update

on:
  schedule:
    - cron: '55 6 * * *'   # daily ~8:00 Berlin (winter); a quick check, the hour-long update only when the calculation changed
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: 'engine branch to use instead of master (optional)'
        required: false
      dry_run:
        description: 'Check only, do not commit'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: forevercore-engine
  cancel-in-progress: false

env:
  ENGINE_BRANCH: main

jobs:
  # A few seconds: did the CALCULATION of Engine change since the lock (Go rules, the schema, the build)? Numbers,
  # generated tables, tests, the interface and documents do not count: we keep the values ourselves. The hour-long
  # update runs only when the calculation changed (or by hand); otherwise this workflow stays green and does nothing.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.upstream.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ENGINE_BRANCH }}
          fetch-depth: 1
      - id: upstream
        run: python3 ForeverCore/engine_update.py --check-only --work "$RUNNER_TEMP/engine" >> "$GITHUB_OUTPUT"

  update:
    needs: check
    if: needs.check.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ENGINE_BRANCH }}
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler lua5.1
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: ForeverCore regressions
        run: |
          python -m unittest discover -s ForeverCore/tests -p 'test_*.py' -v
          (cd ForeverCore && go test -race ./... && go vet ./...)
          lua5.1 ForeverCore/tests/bridge_test.lua .
          lua5.1 ForeverCore/tests/integration_test.lua .
          lua5.1 ForeverCore/tests/hunter_capture_test.lua .

      - name: Update engine
        id: update
        env:
          GOTOOLCHAIN: auto
          UPSTREAM_BRANCH: ${{ inputs.upstream_branch }}
          DRY_RUN: ${{ github.event_name == 'push' && 'true' || inputs.dry_run }}
        run: |
          args=(--work "$RUNNER_TEMP/engine" --windows-exe "$RUNNER_TEMP/dist/ForeverEngine.exe")
          if [ -n "$UPSTREAM_BRANCH" ]; then args+=(--branch "$UPSTREAM_BRANCH"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python ForeverCore/engine_update.py "${args[@]}"

      # the new engine against ForeverCore's tests that run the actual engine (the package build runs the same): an
      # engine that breaks them is not committed, the failure opens the issue below and the last lock stays
      - name: Test the new engine with ForeverCore
        if: success() && github.event_name != 'push' && inputs.dry_run != true
        env:
          GOTOOLCHAIN: auto
        run: |
          python ForeverCore/checkout_engine.py
          python ForeverCore/build_engine.py --output "$RUNNER_TEMP/ForeverEngine-linux"
          export FC_TEST_ENGINE="$RUNNER_TEMP/ForeverEngine-linux"
          export FC_TEST_RUNTIME="$GITHUB_WORKSPACE"
          export FC_TEST_LUA=/usr/bin/lua5.1
          (cd ForeverCore && go test ./... && go vet ./...)

      - name: Save engine update report to artifacts branch
        if: always()
        shell: bash
        run: |
          if [ -f ForeverCore/engine-update-report.json ]; then
            bash .github/scripts/publish-artifacts.sh \
              ForeverCore/engine-update-report.json::engine/latest-report.json
          fi

      - name: Commit new lock
        if: success() && github.event_name != 'push' && inputs.dry_run != true
        id: commit
        run: |
          git config user.name 'forevercore-bot'
          git config user.email 'forevercore-bot@users.noreply.github.com'
          git add ForeverSimBridge/TalentLayoutData.lua ForeverSimBridge/Classes ForeverCore/engine.lock.json ForeverCore/leveling-data.json ForeverCore/engine-data.json ForeverCore/enhancements-data.json
          if [ -f ForeverCore/creature-families.json ]; then git add ForeverCore/creature-families.json; fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          identity=$(python -c "import json;print(json.load(open('ForeverCore/engine.lock.json'))['buildIdentity'])")
          git commit -q -m "ForeverCore: Engine ${identity} mit Level-Overlay"
          # GitHub answers a push with a server error now and then: try again, with the newest main underneath
          for wait in 0 10 30 60 120; do
            sleep "$wait"
            if git push origin "HEAD:${ENGINE_BRANCH}"; then pushed=1; break; fi
            git pull -q --rebase origin "${ENGINE_BRANCH}" || true
          done
          [ -n "${pushed:-}" ] || { echo "push failed after retries"; exit 1; }
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "identity=${identity}" >> "$GITHUB_OUTPUT"

      # a push made with the workflow token starts no other workflow: start the EXE build and the checks by hand,
      # so ForeverCore.exe ships the new engine without anyone pushing again
      - name: Build and check the new engine
        if: success() && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for w in forevercore-package.yml forevercore-offline.yml forevercore-windows.yml; do
            gh workflow run "$w" --ref "${ENGINE_BRANCH}" || echo "could not start $w"
          done

      - name: Open issue on failure
        if: failure() && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="ForeverCore: Engine-Update gestoppt"
          python - <<'PYREPORT' > "$RUNNER_TEMP/engine-failure.md"
          import json, os
          from pathlib import Path
          try:
              r = json.loads(Path('ForeverCore/engine-update-report.json').read_text())
              print('Basis:', r.get('branch'), r.get('base'))
              print('\n```\n' + str(r.get('error', 'Siehe Workflow-Log.'))[:6000] + '\n```')
          except (OSError, ValueError):
              print('Siehe Workflow-Log.')
          print('\nLauf:', os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'])
          print('Vorherige Engine-Releases bleiben erhalten.')
          PYREPORT
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then gh issue comment "$existing" --body-file "$RUNNER_TEMP/engine-failure.md"; else gh issue create --title "$title" --body-file "$RUNNER_TEMP/engine-failure.md"; fi

      - name: Report readings that kept their last value
        if: success() && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYWARN' > "$RUNNER_TEMP/engine-warnings.md"
          import json
          from pathlib import Path
          r = json.loads(Path('ForeverCore/engine-update-report.json').read_text())
          for w in r.get('warnings', []):
              print('-', w)
          PYWARN
          if [ -s "$RUNNER_TEMP/engine-warnings.md" ]; then
            title="ForeverCore: Engine-Update mit Warnungen"
            existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
            if [ -n "$existing" ]; then gh issue comment "$existing" --body-file "$RUNNER_TEMP/engine-warnings.md"; else gh issue create --title "$title" --body-file "$RUNNER_TEMP/engine-warnings.md"; fi
          fi
