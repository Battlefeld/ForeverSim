name: ForeverCore.exe
on:
  push:
    branches: [main]
    # what goes into ForeverCore.exe; documentation and tests alone build nothing
    paths: ['ForeverCore/**', 'ForeverCoreBridge/**', 'ForeverSimBridge/**', '!**.md', '!ForeverCore/tests/**', '!ForeverCore/**_test.go', '.github/workflows/forevercore-package.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forevercore-exe
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler lua5.1
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build and test actual MythicSim integration
        run: |
          python ForeverCore/checkout_engine.py
          python ForeverCore/build_engine.py --output "$RUNNER_TEMP/MythicSim-linux"
          export FC_TEST_ENGINE="$RUNNER_TEMP/MythicSim-linux"
          export FC_TEST_RUNTIME="$GITHUB_WORKSPACE"
          export FC_TEST_LUA=/usr/bin/lua5.1
          (cd ForeverCore && go test -v ./... && go vet ./...)
          lua5.1 ForeverCore/tests/bridge_test.lua .
          lua5.1 ForeverCore/tests/prefetch_test.lua .
          lua5.1 ForeverCore/tests/integration_test.lua .
          lua5.1 ForeverCore/tests/hunter_capture_test.lua .
          lua5.1 ForeverCore/tests/route_next_test.lua .
      - name: Windows binaries
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          python ForeverCore/build_engine.py --output "$RUNNER_TEMP/MythicSim.exe"
          (cd ForeverCore && go build -trimpath -o "$RUNNER_TEMP/ForeverCore.exe" .)
      - name: Pinned Lua runtime
        run: |
          git init "$RUNNER_TEMP/questiedb"
          git -C "$RUNNER_TEMP/questiedb" remote add origin https://github.com/Questie/QuestieDB.git
          git -C "$RUNNER_TEMP/questiedb" fetch --depth=1 origin a376144778947060ce0e81c4b2232ecf671df529
          git -C "$RUNNER_TEMP/questiedb" checkout --detach FETCH_HEAD
          (cd "$RUNNER_TEMP/questiedb/tools/lua-binary" && sha256sum --check SHA256SUMS)
      - name: ForeverRoutes addon of its latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/routes"
          # the one ForeverCore.exe installs both addons: no routes addon, no program
          gh release download --repo Battlefeld/ForeverRoutes --pattern ForeverRoutes-addon.zip --dir "$RUNNER_TEMP/routes"
      - name: Package
        run: |
          mkdir -p dist
          routes=(--routes-addon "$RUNNER_TEMP/routes/ForeverRoutes-addon.zip")
          python ForeverCore/package.py --core-exe "$RUNNER_TEMP/ForeverCore.exe" --engine-exe "$RUNNER_TEMP/MythicSim.exe" --lua "$RUNNER_TEMP/questiedb/tools/lua-binary/lua.exe" --engine-source deps/mythicsim --lua-license "$RUNNER_TEMP/questiedb/tools/lua-binary/THIRD_PARTY_NOTICES.txt" "${routes[@]}" --output dist/ForeverCore_package.zip
      - name: The one ForeverCore.exe (window, installer, package built in)
        run: |
          build="$(date -u +%Y%m%d%H%M%S)"
          echo "BUILD=$build" >> "$GITHUB_ENV"
          python ForeverCore/build_app.py --package dist/ForeverCore_package.zip --output dist/ForeverCore.exe --build "$build"
          [ "$(stat -c%s dist/ForeverCore.exe)" -lt 104857600 ] || { echo "::error::ForeverCore.exe is over 100 MiB"; exit 1; }
      - name: Signed update manifest
        env:
          FOREVERCORE_SIGNING_KEY: ${{ secrets.FOREVERCORE_SIGNING_KEY }}
        run: |
          if [ -z "$FOREVERCORE_SIGNING_KEY" ]; then echo "::warning::FOREVERCORE_SIGNING_KEY not set: installed programs will not update"; exit 0; fi
          (cd ForeverCore && go run . -sign-update ../dist/ForeverCore.exe -update-build "$BUILD" \
            -update-url "https://github.com/Battlefeld/ForeverSim/releases/download/forevercore/ForeverCore.exe" \
            -update-out ../dist/forevercore-update.json)
      - name: Publish ForeverCore.exe (release "forevercore": the download of the README and of the updates)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view forevercore >/dev/null 2>&1 || gh release create forevercore --target main --title "ForeverCore.exe" \
            --notes "The one program that installs ForeverSim and ForeverRoutes and keeps them up to date: download ForeverCore.exe and start it. Rebuilt on every change by the workflow ForeverCore.exe."
          assets=(dist/ForeverCore.exe)
          if [ -f dist/forevercore-update.json ]; then assets+=(dist/forevercore-update.json); fi
          gh release upload forevercore "${assets[@]}" --clobber
          gh release edit forevercore --notes "Build $BUILD: the one program that installs ForeverSim and ForeverRoutes and keeps them up to date. Download ForeverCore.exe and start it."
