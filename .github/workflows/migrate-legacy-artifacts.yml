name: Archive and remove legacy Actions artifacts
# Authenticated listing + unauthenticated signed-redirect download
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-legacy-artifacts.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: legacy-actions-artifact-migration
  cancel-in-progress: false

jobs:
  archive-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Back up, verify, then remove old GitHub Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/migrate-actions-artifacts.py
