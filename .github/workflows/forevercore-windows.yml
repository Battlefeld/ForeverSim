name: ForeverCore Windows bridge regression
on:
  push:
    branches: [main]
    paths: ['ForeverCore/**', '.github/workflows/forevercore-windows.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bridge:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ForeverCore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise window polling beyond callback table capacity
        run: go test -v -run '^(TestWowOriginCallbackReuse|TestPixelCalibration.*)$' -count=1 -timeout=3m .
      - name: Build replacement executable
        run: go build -trimpath -o ../hotfix/ForeverCore.exe .
      - name: Save Windows bridge hotfix to artifacts branch
        shell: bash
        working-directory: .
        run: |
          bash .github/scripts/publish-artifacts.sh \
            hotfix/ForeverCore.exe::windows/hotfix/ForeverCore.exe
