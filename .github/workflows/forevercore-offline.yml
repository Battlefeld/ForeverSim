name: ForeverCore integration
on:
  push:
    branches: [main, claude/focused-lovelace-hqyfx4]
    paths:
      - 'ForeverCore/**'
      - 'ForeverCoreBridge/**'
      - 'ForeverSimBridge/**'
      - '.github/workflows/forevercore-offline.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forevercore-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ForeverCore/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lua
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
      - name: Core checks
        run: |
          python -m unittest discover -s ForeverCore/tests -p 'test_*.py' -v
          cd ForeverCore
          GORACE=atexit_sleep_ms=0 go test -race ./...
          go vet ./...
          GOOS=windows GOARCH=amd64 go build -o "$RUNNER_TEMP/ForeverCore.exe" .
      - name: Addon boundaries and integration
        run: |
          lua5.1 ForeverCore/tests/bridge_test.lua .
          lua5.1 ForeverCore/tests/prefetch_test.lua .
          lua5.1 ForeverCore/tests/integration_test.lua .
          lua5.1 ForeverCore/tests/hunter_capture_test.lua .
          lua5.1 ForeverCore/tests/request_storm_test.lua .
          lua5.1 ForeverCore/tests/route_next_test.lua .
          lua5.1 ForeverCore/tests/item_cache_test.lua .
          lua5.1 ForeverCore/tests/dungeon_catalog_test.lua .
          lua5.1 ForeverCore/tests/sim_cache_key_test.lua .
          lua5.1 ForeverCore/tests/pixel_style_test.lua .
          lua5.1 ForeverCore/tests/pixel_tune_test.lua .
          lua5.1 ForeverCore/tests/item_batch_test.lua .
          lua5.1 ForeverCore/tests/auction_export_test.lua .
          lua5.1 ForeverCore/tests/copy_log_test.lua .
          lua5.1 ForeverCore/tests/state_ref_test.lua .
          lua5.1 ForeverCore/tests/sim_service_test.lua .
          lua5.1 ForeverCore/tests/review_contract_test.lua .
          lua5.1 ForeverCore/tests/window_test.lua .
          lua5.1 ForeverCore/tests/talents_tab_test.lua .
          lua5.1 ForeverCore/tests/hud_test.lua .
          lua5.1 ForeverCore/tests/rotation_tab_test.lua .
          lua5.1 ForeverCore/tests/fight_test.lua .
          lua5.1 ForeverCore/tests/talent_search_test.lua .
          lua5.1 ForeverCore/tests/login_check_test.lua .
          lua5.1 ForeverCore/tests/loot_test.lua .
          lua5.1 ForeverCore/tests/loot_tab_test.lua .
          lua5.1 ForeverCore/tests/enhancements_test.lua .
          lua5.1 ForeverCore/tests/suffix_stats_test.lua .
          lua5.1 ForeverCore/tests/class_filter_test.lua .
          lua5.1 ForeverCore/tests/requirements_test.lua .
          lua5.1 ForeverCore/tests/ui_test.lua .
          lua5.1 ForeverCore/tests/enchant_test.lua .
          lua5.1 ForeverCore/tests/scanner_owner_test.lua .
          lua5.1 ForeverCore/tests/dungeon_report_test.lua .
          for class in WARRIOR PALADIN HUNTER ROGUE PRIEST SHAMAN MAGE WARLOCK DRUID; do
            for level in 1 5 49 50 59 60; do
              lua5.1 ForeverCore/tests/class_ui_test.lua . "$class" "$level"
            done
          done
      - name: Actual MythicSim build and contract tests
        run: |
          sudo apt-get install -y -qq protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          export PATH="$(go env GOPATH)/bin:$PATH"
          python ForeverCore/checkout_engine.py
          python ForeverCore/build_engine.py --output "$RUNNER_TEMP/MythicSim-linux"
          export FC_TEST_ENGINE="$RUNNER_TEMP/MythicSim-linux"
          export FC_TEST_RUNTIME="$GITHUB_WORKSPACE"
          export FC_TEST_LUA=/usr/bin/lua5.1
          (cd ForeverCore && go test -v ./...)
